name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install npm dependencies
        run: npm ci

      - name: Authenticate Dev Hub
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > /tmp/devhub_auth.txt
          sf org login sfdx-url -f /tmp/devhub_auth.txt -a devhub --set-default-dev-hub
          rm -f /tmp/devhub_auth.txt

      - name: Verify against a scratch org
        run: bash scripts/verify-scratch.sh
        env:
          DEVHUB_ALIAS: devhub
